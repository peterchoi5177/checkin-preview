<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>숙소 운영앱 · PC 체크인 v3 (1안 포레스트 · 1280)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --bg:#F6F5F1; --surface:#FFFFFF; --surface-2:#FAF9F6; --surface-3:#EEECE6; --line:#E4E1D9; --line-2:#EFEDE7;
  --ink:#17201B; --ink-2:#545E57; --ink-3:#646B66; --ink-4:#A9AEA9;
  --brand:#1F5A36; --brand-press:#184A2C; --brand-soft:#E4EFE7; --brand-ink:#1F5A36; --on-brand:#FFFFFF;
  --ok:#2E8549; --ok-soft:#E3F1E7; --ok-ink:#22673A;
  --warn:#A8650B; --warn-soft:#FCF1DE; --warn-ink:#8F4E07; --warn-line:#EBC17E;
  --bad:#C2402F; --bad-soft:#FBE9E6; --bad-ink:#A3301F;
  --info:#2A5DB0; --info-soft:#E7EEF9; --info-ink:#244F96;
  --r-sm:11px; --r-md:14px; --r-lg:18px; --sh-1:0 1px 2px rgb(23 32 27/.05); --sh-3:0 16px 40px rgb(23 32 27/.18);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-width:1280px}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{outline:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.n{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.w{width:1280px;margin:0 auto;padding:0 24px}

/* 위쪽 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{height:64px;display:flex;align-items:center;gap:4px}
.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;letter-spacing:-.03em;margin-right:16px;white-space:nowrap}
.logo .m{width:32px;height:32px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.logo .m svg{width:18px;height:18px}
.nav{display:flex;gap:2px}
.nav button{height:40px;padding:0 13px;border-radius:12px;font-size:14.5px;font-weight:650;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;position:relative}
.nav button:hover{background:var(--surface-3);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink)}
.nav button svg{width:15px;height:15px;color:var(--ink-3)}
.nav .sep{width:1px;height:20px;background:var(--line);align-self:center;margin:0 6px}
.nav .bd{min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center;padding:0 5px}
.sp{flex:1}
.tb{height:40px;padding:0 11px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:650;color:var(--ink-2);white-space:nowrap}
.tb:hover{background:var(--surface-3)}
.tb .c{min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.tb .c.i{background:var(--info)}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:13.5px}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-3);padding:6px;z-index:30}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 10px;border-radius:9px;font-weight:650;font-size:14px;white-space:nowrap}
.menu button:hover{background:var(--surface-2)}
.menu button svg{color:var(--ink-3)}
.menu small{margin-left:auto;font-size:12px;color:var(--ink-3)}
.menu .cnt{margin-left:auto;height:20px;padding:0 7px;border-radius:10px;background:var(--warn);color:#fff;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center}

/* 사업장 줄 */
.brs{display:flex;align-items:center;gap:8px;height:60px}
.brs .lb{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-right:4px}
.bp{height:42px;padding:0 14px;border-radius:13px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-weight:750;font-size:14px;position:relative;box-shadow:var(--sh-1);white-space:nowrap}
.bp small{font-size:12px;font-weight:600;color:var(--ink-3)}
.bp small b{color:var(--warn-ink)}
.bp[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.bp[aria-pressed="true"] small{color:rgb(255 255 255/.7)}.bp[aria-pressed="true"] small b{color:#F6C77A}
.bp .dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.all{margin-left:auto;height:40px;padding:0 12px;border-radius:12px;font-weight:700;color:var(--brand-ink);display:inline-flex;align-items:center;gap:4px}
.all:hover{background:var(--brand-soft)}

/* 도구 줄 */
.tool{display:flex;align-items:center;gap:10px;padding:16px 0 12px}
.ds{height:46px;border-radius:var(--r-md);background:var(--surface-3);display:grid;grid-template-columns:44px auto 44px;align-items:center}
.ds .nv{height:46px;display:grid;place-items:center;color:var(--ink-2)}
.ds .c{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:750;padding:0 8px;white-space:nowrap}
.ds .c svg{color:var(--ink-3)}
.ti{font-size:11.5px;font-weight:750;color:var(--brand-ink);background:var(--brand-soft);border-radius:6px;padding:2px 6px}
.tdy{height:46px;padding:0 15px;border-radius:var(--r-md);background:var(--brand);color:var(--on-brand);font-weight:750}
.seg{background:var(--surface-3);border-radius:var(--r-md);padding:3px;display:flex;gap:2px}
.seg button{height:44px;padding:0 14px;border-radius:var(--r-sm);font-size:13.5px;font-weight:650;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button b{font-size:15px;font-weight:800;color:var(--ink)}
.seg button.mon b{color:var(--warn-ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.srch{height:46px;width:230px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:0 12px 0 38px;font-size:14px}
.srw{position:relative}.srw svg{position:absolute;left:12px;top:14px;color:var(--ink-3)}
.btn{height:46px;padding:0 14px;border-radius:var(--r-md);font-weight:750;display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* 표 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:clip;margin-bottom:28px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{height:40px;font-size:12px;font-weight:700;color:var(--ink-3);text-align:left;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:124px;z-index:5;white-space:nowrap}
th.c,td.c{text-align:center}
td{padding:9px 8px;border-top:1px solid var(--line-2);vertical-align:middle}
tr.gh td{background:var(--surface-2);padding:0 14px;height:40px;font-size:13px;font-weight:750;color:var(--ink-2);border-top:1px solid var(--line)}
tr.gh td small{font-weight:550;color:var(--ink-3);margin-left:6px}
tr.gh button{display:inline-flex;align-items:center;gap:6px;height:40px;font-weight:750}
tr.bk{position:relative}
tr.bk:hover td{background:#FCFBF8}
tr.bk td:first-child{position:relative}
tr.bk td:first-child::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--edge,transparent)}
.ck{width:44px;height:44px;display:grid;place-items:center;margin:auto}
.ck .cc{width:26px;height:26px;border-radius:50%;border:2px solid #C3C7C0;display:grid;place-items:center;background:var(--surface);transition:all .2s var(--ease)}
.ck svg{width:15px;height:15px;stroke-width:3;color:#fff;opacity:0;transform:scale(.4);transition:all .22s var(--ease)}
.done .ck .cc{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.done .ck svg{opacity:1;transform:none}
.u{font-size:18px;font-weight:800;letter-spacing:-.03em}
.u small{display:block;font-size:11px;font-weight:700;color:var(--warn-ink);letter-spacing:0}
.nmb{display:block;text-align:left;width:100%;min-height:44px;border-radius:10px;padding:2px 6px;margin:-2px -6px}
.nmb:hover{background:var(--surface-2)}
.nmb b{font-size:15.5px;font-weight:750;display:flex;align-items:center;gap:6px}
.nmb .tel{font-size:12.5px;color:var(--ink-2)}
.tag{font-size:10.5px;font-weight:750;border-radius:6px;padding:1px 5px}
.tag.rv{color:var(--info-ink);background:var(--info-soft)}
.chn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.chn i{width:7px;height:7px;border-radius:50%}
.cs{font-size:11.5px;font-weight:700;color:var(--ok-ink);margin-left:6px}
.st b{font-weight:700;display:block}.st small{font-size:12px;color:var(--ink-3);white-space:nowrap}
.eta{font-size:15px;font-weight:750}
.eta.no{font-size:13px;font-weight:600;color:var(--ink-3)}
.pp{width:46px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font-size:16px;font-weight:800;-moz-appearance:textfield}
.pp::-webkit-inner-spin-button{-webkit-appearance:none}
.pp:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.pp.over{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn-ink)}
.dogs{font-size:13px;line-height:1.5}
.dogs b{font-weight:700}
.dogs small{color:var(--ink-3);white-space:nowrap}
.dogs .w{color:var(--warn-ink);font-weight:750}
.pl{width:84px;height:44px;margin:auto;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:800;line-height:1.15}
.pl small{font-size:11px;font-weight:650;opacity:.88}
.pl.set{background:var(--warn-soft);color:var(--warn-ink)}
.pl.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pl.tbd{background:var(--bad-soft);color:var(--bad-ink);font-size:12.5px}
.pl.add{border:1.5px dashed var(--line);color:var(--ink-3);font-size:12.5px;font-weight:700}
.pl.no{color:var(--ink-3);font-size:12px;font-weight:600}
.mny{text-align:right}
.mny b{font-size:14.5px;font-weight:750;display:block}
.mny .d{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:800;color:var(--warn-ink)}
.mny .d svg{width:14px;height:14px}
.mny small{display:block;font-size:11.5px;color:var(--ink-3)}
.rq{font-size:12.5px;font-weight:650;color:var(--bad-ink);display:flex;gap:5px;align-items:flex-start;margin-bottom:5px;line-height:1.4}
.rq svg{width:14px;height:14px;margin-top:1px}
.memo{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;font-size:13px}
.memo:focus{border-color:var(--brand);background:var(--surface)}
.fb{height:44px;width:100%;border-radius:12px;font-size:13px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.fb:hover{border-color:var(--ink-4)}
.fb.due{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.fb.has{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok-ink)}
.done td{color:var(--ink-3)}
.done .u,.done .nmb b{color:var(--ink-3)}
.note{display:flex;gap:8px;font-size:13px;color:var(--ink-2);line-height:1.6;margin:-12px 0 26px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.note svg{color:var(--ink-3);margin-top:2px}
.note b{color:var(--ink)}

/* 오른쪽 서랍(예약 상세) */
.scrim{position:fixed;inset:0;background:rgb(16 20 18/.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;right:0;bottom:0;width:440px;background:var(--surface);z-index:41;box-shadow:var(--sh-3);transform:translateX(102%);transition:transform .28s var(--ease);display:flex;flex-direction:column}
.drw.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:18px 14px 12px 22px;border-bottom:1px solid var(--line-2)}
.dh h3{font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.25}
.dh h3 small{display:block;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.call{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center}
.x{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3)}
.db{flex:1;overflow:auto;padding:16px 22px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:10px 12px}
.tile small{display:block;font-size:12px;font-weight:650;color:var(--ink-3)}
.tile b{display:block;font-size:15px;font-weight:750}
.tile em{display:block;font-style:normal;font-size:12.5px;color:var(--ink-2)}
.box{border-radius:14px;padding:12px 14px;margin-top:10px;display:flex;gap:10px;align-items:center;font-size:14px}
.box.due{background:var(--warn-soft);color:var(--warn-ink)}
.box.due .amt{font-size:20px;font-weight:800;display:block}
.box.req{background:var(--bad-soft);color:var(--bad-ink);font-weight:650}
.lab{font-size:12.5px;font-weight:700;color:var(--ink-3);margin:16px 2px 8px}
.ta{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:10px 12px;font-size:14.5px;resize:vertical}
.df{display:flex;gap:8px;padding:14px 22px 22px;border-top:1px solid var(--line-2)}
.df .btn{flex:1;justify-content:center;height:50px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--ink);color:#fff;border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;font-weight:600;opacity:0;transition:all .22s var(--ease);z-index:60;pointer-events:none;min-height:50px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{height:36px;padding:0 12px;border-radius:10px;font-weight:800;color:#BFE6CB;background:rgb(255 255 255/.08)}
.rb{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;background:var(--ink);color:#fff;font-size:12.5px}
.rb button{height:30px;padding:0 10px;border-radius:8px;border:1px solid rgb(255 255 255/.25);font-weight:700;font-size:12.5px;color:#fff}
.rb button[aria-pressed="true"]{background:#fff;color:var(--ink)}
</style>
</head>

 <td><button class="nmb" data-det="${i}"><b>${r.nm}${r.rv?`<span class="tag rv">재방문</span>`:""}</b><span class="chn"><i style="background:${cc}"></i>${cn}</span>${r.cs?`<span class="cs">✓수신동의</span>`:""}<br><span class="tel n">${r.tel}</span></button></td>
 <td class="st n"><b>${r.ci}</b><small>${r.n}박 · 예약 ${r.bk}</small></td>
 <td>${r.done?`<span class="eta no n">${r.at} 입실</span>`:r.eta?`<span class="eta n">${r.eta}</span>`:`<span class="eta no">미정</span>`}</td>
 <td class="c"><input class="pp n ${r.pp>r.base?"over":""}" type="number" value="${r.pp}" data-pp="${i}" aria-label="${r.u} 인원"></td>
 <td class="dogs">${r.ext.map(d=>`<b>${d[0]}</b> ${d[1]} <small class="${d[3]?"w":""}">${d[2]}</small>`).join("<br>")}</td>
 <td class="c">${bq(r.ad)}</td>
 <td class="mny n"><b>${won(r.paid)}</b>${r.due&&!r.done?`<span class="d">${ic("banknote")}+${won(r.due)}</span><small>${r.dt}</small>`:""}</td>
 <td>${r.rq?`<div class="rq">${ic("circle-alert")}${r.rq}</div>`:""}<input class="memo" placeholder="관리자 메모…" value="${r.memo||""}"></td>
 <td class="c">${r.field?`<button class="fb has n" data-toast="현장기록 보기">${ic("check")}${won(r.field)}</button>`:r.due&&!r.done?`<button class="fb due n" data-toast="현장기록 받기 (항목 미리 채움)">받기 +${won(r.due)}</button>`:`<button class="fb" data-toast="현장기록">+ 현장기록</button>`}</td></tr>`}
function render(){
 $("#brs").innerHTML=`<span class="lb">사업장</span>`+BR.map((b,i)=>`<button class="bp" data-br="${i}" aria-pressed="${S.b===i}">${b[0]}<small class="n">입실 ${b[1]} · <b>대기 ${b[2]}</b></small>${b[3]?'<span class="dot" title="미해결 인수인계"></span>':""}</button>`).join("")+`<button class="all" data-toast="본사 › 전체 예약 (사업장 6곳)">전체 예약 보기${ic("chevron-right")}</button>`;
 $("#dl").innerHTML=`${ic("calendar-days")}${dl(S.day)}${S.day===0?'<span class="ti">오늘</span>':""}`;$("#tdy").hidden=S.day===0;
 const wait=R.map((r,i)=>i).filter(i=>!R[i].done).sort((a,b)=>(R[a].eta||"99").localeCompare(R[b].eta||"99")),done=R.map((r,i)=>i).filter(i=>R[i].done);
 const dueI=wait.filter(i=>R[i].due),sum=dueI.reduce((s,i)=>s+R[i].due,0),bbq=R.filter(r=>r.ad&&r.ad!=="none").length;
 $("#seg").innerHTML=[["all","전체",R.length],["wait","입실 대기",wait.length],["due","받을 돈",dueI.length+" · +"+won(sum),"mon"],["bbq","BBQ",bbq]].map(([k,l,c,cl])=>`<button class="${cl||""}" data-f="${k}" aria-pressed="${S.f===k}">${l}<b class="n">${c}</b></button>`).join("");
 const ok=i=>(S.f==="all"||(S.f==="wait"&&!R[i].done)||(S.f==="due"&&R[i].due&&!R[i].done)||(S.f==="bbq"&&R[i].ad&&R[i].ad!=="none"))&&(!S.q||(R[i].nm+R[i].u).includes(S.q));
 const W=wait.filter(ok),D=done.filter(ok);
 let h="";if(W.length)h+=`<tr class="gh"><td colspan="11">입실 대기 ${W.length}<small>도착순</small></td></tr>`+W.map(i=>tr(R[i],i)).join("");
 if(D.length&&S.f!=="wait"&&S.f!=="due")h+=`<tr class="gh"><td colspan="11"><button data-dt>${ic(S.doneOpen?"chevron-down":"chevron-right")}입실 완료 ${D.length}</button></td></tr>`+(S.doneOpen?D.map(i=>tr(R[i],i)).join(""):"");
 $("#tb").innerHTML=h||`<tr><td colspan="11" style="text-align:center;color:var(--ink-3);height:80px">해당하는 예약이 없어요</td></tr>`;
 document.querySelectorAll(".hq").forEach(x=>x.hidden=S.role!=="hq");document.querySelectorAll(".mg").forEach(x=>x.hidden=S.role==="staff");
 document.querySelector("th").parentNode.querySelectorAll("th").forEach(t=>t.style.top=(S.role==="hq"?124:64)+"px");
}
function det(i){const r=R[i];const [cn,cc]=CH[r.ch];
 $("#drw").innerHTML=`<div class="dh"><h3><small><span class="chn"><i style="background:${cc}"></i>${cn}</span> · 예약 ${r.bk}</small>${r.u} · ${r.nm}</h3><span class="sp"></span><button class="call" data-toast="${r.tel}로 전화" aria-label="전화">${ic("phone")}</button><button class="x" data-x aria-label="닫기">${ic("x")}</button></div>
 <div class="db"><div class="tg"><div class="tile"><small>숙박</small><b class="n">${r.ci}</b><em>${r.n}박</em></div><div class="tile"><small>도착</small><b class="n">${r.eta||"미정"}</b><em>${r.done?"입실함":"입실 전"}</em></div><div class="tile"><small>인원</small><b class="n">${r.pp}명</b><em>기본 ${r.base}명</em></div><div class="tile"><small>반려견</small><b>${r.ext.map(d=>d[0]+" · "+d[1]+" · "+d[2]).join("<br>")}</b></div><div class="tile"><small>결제</small><b class="n">${won(r.paid)}원</b><em>${cn}</em></div><div class="tile"><small>연락처</small><b class="n">${r.tel}</b><em>${r.cs?"수신동의 ✓":"수신동의 없음"}</em></div></div>
 ${r.due&&!r.done?`<div class="box due">${ic("banknote")}<div style="flex:1"><small style="font-weight:700">받을 돈</small><span class="amt n">+${won(r.due)}원</span><small>${r.dt}</small></div><button class="btn pri" data-toast="현장기록 받기">현장기록 받기</button></div>`:""}
 ${r.rq?`<div class="box req">${ic("circle-alert")}${r.rq}</div>`:""}
 <div class="lab">관리자 메모</div><textarea class="ta" placeholder="다음 근무자에게 남길 메모">${r.memo||""}</textarea></div>
 <div class="df">${r.done?`<button class="btn" data-chk="${i}">입실 취소</button>`:`<button class="btn pri" data-chk="${i}">${ic("check")}입실 체크</button>`}</div>`;
 $("#scrim").classList.add("on");$("#drw").classList.add("on")}
function closeD(){$("#scrim").classList.remove("on");$("#drw").classList.remove("on")}
let ut,uf;function toast(m,u){$("#tt").textContent=m;uf=u;$("#tu").hidden=!u;$("#toast").classList.add("on");clearTimeout(ut);ut=setTimeout(()=>$("#toast").classList.remove("on"),u?4000:1800)}
$("#tu").onclick=()=>{uf&&uf();render();$("#toast").classList.remove("on")};
document.addEventListener("click",e=>{const g=s=>e.target.closest(s);let el;
 if(!g(".dd"))document.querySelectorAll(".menu").forEach(m=>m.hidden=true);
 if(el=g("[data-role]")){S.role=el.dataset.role;document.querySelectorAll("[data-role]").forEach(b=>b.setAttribute("aria-pressed",b===el));render();return}
 if(el=g("[data-m]")){const m=document.getElementById(el.dataset.m);const was=m.hidden;document.querySelectorAll(".menu").forEach(x=>x.hidden=true);m.hidden=!was;return}
 if(el=g("[data-br]")){S.b=+el.dataset.br;render();toast(`${BR[S.b][0]}(으)로 전환 · 날짜·보기·검색어 그대로`);return}
 if(el=g("[data-day]")){const v=+el.dataset.day;S.day=v===0?0:S.day+v;render();return}
 if(el=g("[data-f]")){S.f=el.dataset.f;render();return}
 if(el=g("[data-dt]")){S.doneOpen=!S.doneOpen;render();return}
 if(el=g("[data-chk]")){const r=R[+el.dataset.chk];const was=r.done;r.done=was?0:1;if(!was)r.at="16:2"+el.dataset.chk;closeD();render();toast(`${r.u} ${was?"입실 취소":"입실 완료"}`,()=>{r.done=was});return}
 if(el=g("[data-det]")){det(+el.dataset.det);return}
 if(el=g("[data-x]")||g("#scrim")){closeD();return}
 if(el=g("[data-toast]")){toast(el.dataset.toast);document.querySelectorAll(".menu").forEach(m=>m.hidden=true);return}
});
document.addEventListener("change",e=>{if(e.target.dataset.pp!==undefined){const r=R[+e.target.dataset.pp];const p=r.pp;r.pp=Math.max(1,parseInt(e.target.value)||p);e.target.classList.toggle("over",r.pp>r.base);if(r.pp!==p)toast(`${r.u} 인원 ${r.pp}명 저장`,()=>{r.pp=p})}});
$("#q").addEventListener("input",e=>{S.q=e.target.value.trim();render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeD()});
render();
</script>
</body>
</html>
